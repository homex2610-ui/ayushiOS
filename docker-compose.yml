version: '3.8'
services:
  mc:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      VERSION: "1.21.11"
      TYPE: "VANILLA"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "changeme"
      ENABLE_ROLLING_LOGS: "TRUE"
      MEMORY: "2G"
    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      - ./mc-data:/data
